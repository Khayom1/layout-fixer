<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Layout Fixer — Keyboard layout recovery</title>
<desc id="desc">Animated showcase of keyboard layout correction: mistyped Russian and Tajik Cyrillic, reversible key-position mapping, corrected Latin text, four conversion directions, AUTO script detection, local privacy, offline PWA and multilingual interface.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d19"/><stop offset=".55" stop-color="#111b31"/><stop offset="1" stop-color="#090f1d"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9c8cff"/><stop offset="1" stop-color="#5b9dff"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57d9ef"/><stop offset="1" stop-color="#a18bff"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18243b"/><stop offset="1" stop-color="#10192b"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".4"/></filter>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8db7ff" stroke-opacity=".055"/></pattern>
 <style>
 .t{font-family:Inter,Arial,sans-serif;fill:#eff4ff}.m{font-family:Inter,Arial,sans-serif;fill:#94a5c2}.tiny{font-size:11px;letter-spacing:1.8px;font-weight:750}.small{font-size:14px}.label{font-size:18px;font-weight:750}.panel{fill:url(#panel);stroke:#2b3a56;stroke-width:1.5}.key{fill:#1a2942;stroke:#405575;stroke-width:1.2}.cyan{fill:#75dff0}.violet{fill:#aa9aff}.wire{fill:none;stroke:#53698e;stroke-width:3;stroke-linecap:round}
 </style>
</defs>
<rect width="1440" height="1080" rx="30" fill="url(#bg)"/><rect width="1440" height="1080" rx="30" fill="url(#grid)"/>
<circle cx="1210" cy="110" r="290" fill="#7666ee" opacity=".07"/><circle cx="120" cy="1000" r="260" fill="#3cbfdb" opacity=".045"/>
<!-- brand -->
<g transform="translate(72 54)"><rect width="58" height="58" rx="17" fill="url(#violet)"/><text x="29" y="40" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">L</text><text x="76" y="36" class="t" font-size="31" font-weight="850">LAYOUT FIXER</text><text x="78" y="55" class="m tiny">KEYBOARD LAYOUT RECOVERY</text></g>
<text x="1368" y="86" text-anchor="end" class="cyan tiny">RU ↔ EN · TJ ↔ EN · OFFLINE</text>
<text x="72" y="220" class="t" font-size="68" font-weight="850" letter-spacing="-3">Wrong layout?</text>
<text x="72" y="294" font-size="68" font-weight="850" letter-spacing="-3" fill="url(#cyan)">Get your words back.</text>
<text x="76" y="340" class="m" font-size="20">Character-position conversion. No translation. No upload. No cloud.</text>
<!-- Main workflow panel -->
<rect x="60" y="390" width="1320" height="420" rx="26" fill="#0b1424" stroke="#2b3a56" filter="url(#shadow)"/>
<text x="92" y="432" class="cyan tiny">01 / THE CONVERSION ENGINE</text>
<text x="1348" y="432" text-anchor="end" class="m tiny">ILLUSTRATIVE WORKFLOW · NOT A LIVE SESSION</text>
<!-- input -->
<g transform="translate(95 485)"><rect width="360" height="240" rx="19" class="panel"/><text x="25" y="36" class="m tiny">INPUT / WRONG LAYOUT</text><rect x="24" y="56" width="312" height="70" rx="12" fill="#0b1423" stroke="#354867"/><text x="43" y="101" class="t" font-family="monospace" font-size="29" font-weight="700">руддщ, мир!</text><text x="25" y="158" class="m small">You typed English words</text><text x="25" y="180" class="m small">while Russian was active.</text>
 <g transform="translate(24 199)"><rect width="38" height="27" rx="6" class="key"/><rect x="44" width="38" height="27" rx="6" class="key"/><rect x="88" width="38" height="27" rx="6" class="key"/><rect x="132" width="38" height="27" rx="6" class="key"/><rect x="176" width="38" height="27" rx="6" class="key"/><rect x="220" width="38" height="27" rx="6" class="key"/><text x="19" y="19" text-anchor="middle" class="t small">Й</text><text x="63" y="19" text-anchor="middle" class="t small">Ц</text><text x="107" y="19" text-anchor="middle" class="t small">У</text><text x="151" y="19" text-anchor="middle" class="t small">К</text><text x="195" y="19" text-anchor="middle" class="t small">Е</text><text x="239" y="19" text-anchor="middle" class="t small">Н</text></g></g>
<!-- engine -->
<g transform="translate(540 535)"><circle cx="110" cy="75" r="76" fill="#142746" stroke="#6e91ff" stroke-width="2"/><circle cx="110" cy="75" r="57" fill="none" stroke="#8c8cff" stroke-width="2" stroke-dasharray="7 8"><animateTransform attributeName="transform" type="rotate" from="0 110 75" to="360 110 75" dur="12s" repeatCount="indefinite"/></circle><circle cx="110" cy="75" r="38" fill="#1c3151" stroke="#58d9ec" stroke-width="1.5"/><path d="M91 75h38M110 56v38" stroke="#d8f8ff" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="75" r="6" fill="#72e4f1" filter="url(#glow)"><animate attributeName="r" values="5;10;5" dur="1.8s" repeatCount="indefinite"/></circle><text x="110" y="183" text-anchor="middle" class="cyan tiny">KEY POSITION MAP</text><text x="110" y="205" text-anchor="middle" class="m small">Reversible rules</text></g>
<!-- output -->
<g transform="translate(930 485)"><rect width="410" height="240" rx="19" class="panel"/><text x="25" y="36" class="cyan tiny">OUTPUT / RESTORED TEXT</text><rect x="24" y="56" width="362" height="70" rx="12" fill="#0b1423" stroke="#477e8a"/><text x="43" y="101" fill="url(#cyan)" font-family="monospace" font-size="29" font-weight="700">hello, vbh!</text><text x="25" y="158" class="t label">Readable text. Same meaning.</text><text x="25" y="182" class="m small">Unknown characters stay untouched.</text><rect x="24" y="199" width="118" height="26" rx="8" fill="#153c3d" stroke="#398e8b"/><text x="83" y="217" text-anchor="middle" class="cyan tiny">LOCAL ONLY</text><text x="160" y="217" class="m" font-size="11">No text sent to a server</text></g>
<!-- animated flow -->
<path d="M455 605H540 M760 605H930" class="wire"/>
<path d="M455 605H540" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" values="0;-64" dur="1.4s" repeatCount="indefinite"/></path>
<path d="M760 605H930" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" values="0;-64" dur="1.4s" repeatCount="indefinite"/></path>
<circle r="7" fill="#75e7f2" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M455 605H540"/></circle>
<circle r="7" fill="#b2a2ff" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M760 605H930"/></circle>
<!-- capabilities cards -->
<text x="72" y="870" class="cyan tiny">02 / ONE TOOL · FOUR DIRECTIONS · THREE LANGUAGES</text>
<g transform="translate(60 900)">
 <rect width="310" height="112" rx="17" class="panel"/><text x="22" y="34" class="violet tiny">CONVERSION</text><text x="22" y="65" class="t label">RU ↔ EN</text><text x="22" y="89" class="m small">Russian ⇄ English</text>
</g>
<g transform="translate(390 900)">
 <rect width="310" height="112" rx="17" class="panel"/><text x="22" y="34" class="cyan tiny">TAJIK SUPPORT</text><text x="22" y="65" class="t label">TJ ↔ EN</text><text x="22" y="89" class="m small">Reversible ~g ~i ~q ~u ~h ~j</text>
</g>
<g transform="translate(720 900)">
 <rect width="310" height="112" rx="17" class="panel"/><text x="22" y="34" class="violet tiny">SMART INPUT</text><text x="22" y="65" class="t label">AUTO detection</text><text x="22" y="89" class="m small">Cyrillic detected · Latin not guessed</text>
</g>
<g transform="translate(1050 900)">
 <rect width="330" height="112" rx="17" class="panel"/><text x="22" y="34" class="cyan tiny">PRIVATE BY DESIGN</text><text x="22" y="65" class="t label">Offline-ready PWA</text><text x="22" y="89" class="m small">Local history · TXT import/export</text>
</g>
<text x="720" y="1050" text-anchor="middle" class="m" font-size="12">ENGLISH · РУССКИЙ · ТОҶИКӢ  /  DARK + LIGHT  /  BROWSER + PYTHON CLI</text>
</svg>