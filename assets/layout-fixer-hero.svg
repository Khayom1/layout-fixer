<rect width="1200" height="300" rx="26" fill="url(#bg)"/><rect width="1200" height="300" rx="26" fill="url(#grid)"/>
<g transform="translate(78 78)"><rect width="330" height="144" rx="18" fill="#111e32" stroke="#38516f"/><text x="24" y="34" fill="#8ca4c4" font-family="monospace" font-size="13" letter-spacing="2">INPUT / RAW</text><g font-family="monospace" font-size="24" font-weight="700" fill="#d6e4f8"><text x="26" y="82">руддщ</text><text x="154" y="82" fill="#7c9bbd">фдшпт</text><text x="26" y="119" fill="#7c9bbd">ghbdtn</text><text x="154" y="119">руддщ</text></g><circle cx="285" cy="28" r="3" fill="#65dfff"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="299" cy="28" r="3" fill="#65dfff"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle></g>
